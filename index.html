<!DOCTYPE html> <!-- Określenie typu dokumentu jako HTML5. -->
<html lang="pl" data-theme="light"> <!-- Glówny znacznik HTML z ustawionym językiem polskim i domyślnym motywem jasnym. -->
<head> <!-- Rozpoczęcie sekcji nagłówkowej dokumentu. -->
    <meta charset="UTF-8"> <!-- Ustawienie kodowania znaków na UTF-8 (obsługa polskich znaków). -->
    <meta name="author" content="SP7LCK, SQ7CL"> <!-- Meta dane z autorami aplikacji. -->
    <meta name="copyright" content="MIT License - Free for use, modification, and distribution"> <!-- Informacja o licencji MIT. -->
    <meta name="version" content="1.3.0"> <!-- Wersja aplikacji. -->
    <meta name="description" content="Prosty loger do zawodów IARU HF 2026, pomocny w przygotowaniu pliku logu do wysyłki."> <!-- Opis zawartości strony. -->
    <meta name="keywords" content="IARU, HF, contest, SN0HQ, zawody, loger, logowanie, log"> <!-- Słowa kluczowe dla wyszukiwarek. -->
    <meta name="robots" content="index, follow"> <!-- Instrukcja dla robotów indeksujących sieć. -->
    <title>Prosty Log Zawodów IARU HF World Championship</title> <!-- Tytuł wyświetlany na karcie przeglądarki. -->
<style> /* Rozpoczęcie bloku ze stylami CSS. */
    /* ==========================================================================
       ZMIENNE CSS: MOTYW JASNY (DOMYŚLNY)
       ========================================================================== */
    :root { /* Definicja globalnych zmiennych CSS dla domyślnego motywu (jasnego). */
        /* [SZYBKA MODYFIKACJA: KOLORYSTYKA MOTYWU JASNEGO] Można tu łatwo zmienić kolory interfejsu. */
        --bg-main: #f8fafc; /* Kolor tła całej strony. */
        --bg-card: #ffffff; /* Kolor tła kart i kontenerów z danymi. */
        --bg-input: #ffffff; /* Kolor tła pól formularza. */
        --text-main: #1e293b; /* Główny kolor tekstu. */
        --text-muted: #64748b; /* Stonowany/szary kolor tekstu. */
        --accent: #2563eb; /* Główny kolor akcentu (np. przyciski, nagłówki). */
        --accent-hover: #1d4ed8; /* Kolor akcentu po najechaniu kursorem myszy. */
        --border-color: #cbd5e1; /* Kolor obramowań elementów. */
        --table-header-bg: #f1f5f9; /* Kolor tła nagłówków w tabeli. */
        --radius: 10px; /* Domyślny promień zaokrąglenia rogów. */
        --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); /* Lekki cień elementów. */
    } /* Koniec bloku zmiennych domyślnych. */

    /* ==========================================================================
       ZMIENNE CSS: MOTYW CIEMNY
       ========================================================================== */
    [data-theme="dark"] { /* Nadpisanie zmiennych w przypadku aktywnego motywu ciemnego. */
        /* [SZYBKA MODYFIKACJA: KOLORYSTYKA MOTYWU CIEMNEGO] */
        --bg-main: #0f172a; /* Ciemne tło całej strony. */
        --bg-card: #1e293b; /* Ciemne tło dla kart i kontenerów. */
        --bg-input: #0f172a; /* Ciemne tło pól wprowadzania tekstów. */
        --text-main: #f8fafc; /* Jasny tekst w trybie nocnym. */
        --text-muted: #94a3b8; /* Jasno-szary stonowany tekst. */
        --accent: #3b82f6; /* Jasno-niebieski kolor akcentu. */
        --accent-hover: #60a5fa; /* Jasniejszy odcień niebieskiego przy najechaniu. */
        --border-color: #334155; /* Ciemniejsza obramówka. */
        --table-header-bg: #1e293b; /* Ciemne tło dla nagłówka tabeli. */
        --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); /* Głęboki cień elementów. */
    } /* Koniec bloku zmiennych motywu ciemnego. */

    /* ==========================================================================
       STYLE GLOBALNE
       ========================================================================== */
    body { /* Style dotyczące całego elementu body. */
        background-color: var(--bg-main); /* Przypisanie koloru tła za pomocą zmiennej. */
        color: var(--text-main); /* Przypisanie głównego koloru czcionki. */
        font-family: "Fira Code", "JetBrains Mono", Consolas, monospace; /* Czcionka stałoszerokościowa. */
        font-size: 16px; /* Rozmiar czcionki bazowej. */
        padding: 20px; /* Wewnętrzne odstępy od krawędzi ekranu. */
        margin: 0; /* Wyzerowanie zewnętrznych marginesów. */
        transition: background-color 0.3s, color 0.3s; /* Płynna zmiana kolorów przy przełączaniu motywu. */
    } /* Koniec stylów dla body. */

    .container { /* Style dla głównego kontenera otaczającego stronę. */
        max-width: 880px; /* Maksymalna szerokość kontenera. */
        margin: 0 auto; /* Wyśrodkowanie kontenera na stronie. */
        position: relative; /* Pozycjonowanie względne dla ewentualnych elementów potomnych. */
    } /* Koniec stylów dla .container. */

    /* Przełącznik motywu w prawym górnym rogu */
    .theme-toggle-container { /* Kontener na przycisk zmiany motywu. */
        display: flex; /* Układ elastyczny. */
        justify-content: flex-end; /* Wyrównanie zawartości do prawej krawędzi. */
        margin-bottom: 10px; /* Dolny margines od kolejnych elementów. */
    } /* Koniec stylów dla kontenera przycisku motywu. */

    .theme-toggle-btn { /* Przycisk zmiany motywu. */
        background: var(--bg-card); /* Tło przycisku ze zmiennej. */
        color: var(--text-main); /* Kolor tekstu przycisku ze zmiennej. */
        border: 1px solid var(--border-color); /* Obramowanie przycisku. */
        padding: 8px 16px; /* Wewnętrzny odstęp w przycisku. */
        border-radius: var(--radius); /* Zaokrąglenie rogów przycisku. */
        cursor: pointer; /* Kursor w kształcie rączki po najechaniu. */
        font-size: 14px; /* Rozmiar tekstu przycisku. */
        font-weight: 600; /* Pogrubienie czcionki przycisku. */
        width: auto; /* Domyślna dopasowana szerokość przycisku. */
        margin-top: 0; /* Wyzerowanie górnego marginesu. */
        box-shadow: var(--box-shadow); /* Efekt cienia pod przyciskiem. */
        transition: background-color 0.2s, color 0.2s, border-color 0.2s; /* Płynne przejścia po najechaniu. */
    } /* Koniec stylów przycisku przełączania motywu. */

    .theme-toggle-btn:hover { /* Efekt najechania myszą na przycisk motywu. */
        border-color: var(--accent); /* Zmiana obramowania na kolor akcentu po najechaniu. */
    } /* Koniec stanu hover dla przycisku motywu. */

    h1, h2 { /* Style nagłówków stopnia 1 i 2. */
        color: var(--text-main); /* Przypisanie tekstu nagłówków. */
        text-align: center; /* Wyśrodkowanie tekstu w nagłówkach. */
        border-bottom: 2px solid var(--accent); /* Linia pod nagłówkiem. */
        padding-bottom: 12px; /* Odstęp od tekstu do dolnej linii. */
        margin-bottom: 25px; /* Margines dolny pod nagłówkiem. */
    } /* Koniec stylów nagłówków. */

    .config-box, .qso-box { /* Style sekcji konfiguracyjnych oraz tworzenia QSO. */
        background-color: var(--bg-card); /* Tło sekcji. */
        border: 1px solid var(--border-color); /* Obramowanie sekcji. */
        border-radius: var(--radius); /* Zaokrąglenie rogów sekcji. */
        padding: 20px; /* Odstęp wewnętrzny sekcji. */
        margin-bottom: 20px; /* Dolny margines do następnego bloku. */
        box-shadow: var(--box-shadow); /* Nadanie cienia. */
        transition: background-color 0.3s, border-color 0.3s; /* Animacja przejścia przy zmianie motywu. */
    } /* Koniec stylów dla skrzynek konfiguracyjnych. */

    label { /* Style dla etykiet formularza. */
        display: inline-block; /* Element blokowo-liniowy dla poprawnego wymiarowania. */
        width: 280px; /* Stała szerokość etykiet w celu wyrównania formularza. */
        font-weight: 600; /* Pogrubiony tekst etykiet. */
        margin-top: 10px; /* Margines górny etykiety. */
        color: var(--text-main); /* Kolor tekstu etykiet. */
    } /* Koniec stylów etykiet. */

    .radio-group { /* Kontener dla przełączników opcji (radio). */
        display: inline-block; /* Wyświetlanie liniowo-blokowe. */
        margin-top: 10px; /* Górny margines kontenera. */
    } /* Koniec stylów grupy radio. */

    .radio-group label { /* Modyfikacja etykiet wewnątrz grupy radio. */
        width: auto; /* Szerokość automatyczna zależna od długości tekstu. */
        margin-right: 15px; /* Odstęp po prawej stronie. */
        cursor: pointer; /* Zmiana kursora na wskaźnik. */
        font-weight: normal; /* Standardowa grubość tekstu. */
    } /* Koniec opisu etykiet radio. */

    .radio-group input { /* Style dla samego przycisku radio. */
        width: auto; /* Automatyczna szerokość. */
        margin-right: 5px; /* Odstęp od pola do tekstu etykiety. */
        accent-color: var(--accent); /* Zmiana koloru zaznaczenia przełącznika radio. */
    } /* Koniec stylów wejść radio. */

    input, select { /* Style dla domyślnych pól wejściowych oraz list wyboru. */
        font-size: 16px; /* Wielkość tekstu pola. */
        color: var(--text-main); /* Kolor tekstu wpisywanego. */
        background-color: var(--bg-input); /* Kolor tła wewnątrz pola. */
        border: 1px solid var(--border-color); /* Obramowanie pola. */
        border-radius: 6px; /* Zaokrąglenie krawędzi pól. */
        padding: 8px 12px; /* Odstęp wewnętrzny tekstu od obramowania. */
        width: 385px; /* Stała szerokość pól w formularzu. */
        font-family: "Fira Code", "JetBrains Mono", Consolas, monospace; /* Czcionka monospaced. */
        transition: border-color 0.2s, box-shadow 0.2s, background-color 0.3s, color 0.3s; /* Płynne zmiana efektów. */
    } /* Koniec stylów pól do wprowadzania wartości. */

    input:focus, select:focus { /* Stan aktywacji/fokusa na polu formularza. */
        outline: none; /* Usunięcie domyślnej obramówki przeglądarki. */
        border-color: var(--accent); /* Kolor krawędzi aktywnego pola. */
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); /* Poświata dookoła aktywnego pola. */
    } /* Koniec opisu efektu pola aktywnego. */

    button { /* Ogólne style dla przycisków w aplikacji. */
        font-size: 18px; /* Rozmiar czcionki na przyciskach. */
        font-weight: 600; /* Pogrubienie napisu. */
        color: #ffffff; /* Biały kolor tekstu przycisków. */
        background-color: var(--accent); /* Główny kolor tła z ustawień. */
        border: none; /* Usunięcie obramowania. */
        border-radius: var(--radius); /* Zaokrąglenie krawędzi. */
        padding: 12px 20px; /* Wewnętrzny margines w przycisku. */
        margin-top: 20px; /* Margines górny. */
        cursor: pointer; /* Kursor typu interaktywnego. */
        width: 100%; /* Domyślna szerokość na 100% szerokości elementu nadrzędnego. */
        transition: background-color 0.2s, transform 0.1s; /* Płynna zmiana tła i kliknięcia. */
    } /* Koniec stylów ogólnych przycisków. */

    button:hover { /* Efekt najechania na jakikolwiek przycisk. */
        background-color: var(--accent-hover); /* Ciemniejszy odcień przy najechaniu. */
    } /* Koniec najechania na przycisk. */

    button:active { /* Efekt kliknięcia (wciśnięcia) przycisku. */
        transform: translateY(1px); /* Nieznaczny ruch przycisku w dół. */
    } /* Koniec wciśnięcia przycisku. */

    table { /* Style tabeli prezentującej wpisane łączności. */
        width: 100%; /* Tabela zajmuje 100% dostępnej szerokości. */
        border-collapse: separate; /* Włączenie osobnych krawędzi dla uzyskania zaokrągleń. */
        border-spacing: 0; /* Wyzerowanie przestrzeni pomiędzy komórkami. */
        margin-top: 20px; /* Górny margines nad tabelą. */
        background-color: var(--bg-card); /* Tło dla tabeli. */
        color: var(--text-main); /* Kolor czcionki tabeli. */
        border-radius: var(--radius); /* Zaokrąglenie całej tabeli. */
        overflow: hidden; /* Przycięcie zawartości wykraczającej za zaokrąglenia. */
        border: 1px solid var(--border-color); /* Obramowanie tabeli. */
        transition: background-color 0.3s, border-color 0.3s; /* Animacja zmiany motywu. */
    } /* Koniec stylizacji tabeli. */

    th, td { /* Style nagłówków oraz komórek tabeli. */
        padding: 12px; /* Odstęp wewnętrzny komórki. */
        text-align: center; /* Wyśrodkowanie zawartości komórek. */
        font-size: 15px; /* Rozmiar czcionki w komórkach. */
        border-bottom: 1px solid var(--border-color); /* Dolne obramowanie każdej komórki. */
    } /* Koniec stylów komórek tabeli. */

    th { /* Specyficzne style nagłówków tabeli. */
        background-color: var(--table-header-bg); /* Tło nagłówka. */
        color: var(--accent); /* Wyróżniający kolor nagłówków tabeli. */
        font-weight: 600; /* Pogrubienie tekstu w nagłówkach. */
        border-bottom: 2px solid var(--accent); /* Grubsza podreślająca linia pod nagłówkami. */
    } /* Koniec stylów th. */

    tr:last-child td { /* Wyjątek dla ostatniego wiersza w tabeli. */
        border-bottom: none; /* Brak dolnej linii dla ostatniego wiersza. */
    } /* Koniec wyjątku ostatniego wiersza. */

    .counter { /* Styl licznika całkowitej liczby zrobionych łączności. */
        font-size: 18px; /* Rozmiar czcionki licznika. */
        font-weight: 600; /* Pogrubienie czcionki. */
        text-align: center; /* Wyśrodkowanie tekstu. */
        margin-bottom: 15px; /* Margines od tabeli lub przycisków. */
        color: var(--text-muted); /* Stonowany kolor tekstu. */
    } /* Koniec stylizowania licznika. */

    #manualTimeContainer { /* Kontener wprowadzania ręcznej daty i czasu. */
        margin-top: 15px; /* Odstęp od opcji wyboru czasu. */
        border-left: 3px solid var(--accent); /* Ozdobny kolorowy pasek z lewej strony. */
        padding-left: 15px; /* Odstęp tekstu od lewej kreski. */
    } /* Koniec stylów kontenera czasu ręcznego. */

    #manualTimeContainer input { /* Style pojedynczych pól daty/czasu w trybie ręcznym. */
        width: 190px; /* Zmniejszona szerokość pól. */
        margin-right: 10px; /* Margines po prawej stronie elementu. */
    } /* Koniec opisu dla pól daty/czasu ręcznego. */

    .footer { /* Style stopki umieszczonej na samym dole strony. */
        margin-top: 40px; /* Margines od górnych elementów. */
        padding: 15px; /* Wewnętrzne odstępy w stopce. */
        text-align: center; /* Wyśrodkowanie tekstu. */
        border-top: 1px solid var(--border-color); /* Linia oddzielająca stopkę od reszty strony. */
        font-size: 13px; /* Zmniejszona czcionka w stopce. */
        color: var(--text-muted); /* Stonowany kolor tekstu stopki. */
    } /* Koniec opisu stylizacji stopki. */
</style> <!-- Koniec bloków stylów CSS. -->
</head> <!-- Koniec sekcji nagłówka dokumentu HTML. -->
<body> <!-- Początek widocznej treści dokumentu HTML. -->

<div class="container"> <!-- Glówny kontener pozycjonujący aplikację na środku. -->
    <!-- Przełącznik motywu graficznego -->
    <div class="theme-toggle-container"> <!-- Kontener wyrównujący przycisk przełączania motywu. -->
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()"> <!-- Przycisk zmiany trybu z przypisanym zdarzeniem kliknięcia. -->
            🌙 Motyw: Ciemny <!-- Domyślny tekst przycisku zmiany motywu. -->
        </button> <!-- Koniec przycisku przełącznika. -->
    </div> <!-- Koniec kontenera przełącznika. -->

    <!-- [SZYBKA MODYFIKACJA: TYTUL STRONY] -->
    <h1>Loger IARU HF World Championship</h1> <!-- Glówny nagłówek strony. -->
    
    <!-- SEKCJA 1: Podstawowe dane stacji -->
    <div class="config-box"> <!-- Kontener konfiguracji stacji. -->
        <h2>Dane Twojej Stacji</h2> <!-- Nagłówek sekcji danych stacji. -->
        <label for="myCall">Twój znak (CALLSIGN):</label> <!-- Etykieta dla pola ze znakiem stacji. -->
        <input type="text" id="myCall" placeholder="TU WPISZ TWÓJ ZNAK" oninput="this.value=this.value.toUpperCase()"><br> <!-- Pole wpisywania znaku z wymuszeniem wielkich liter. -->
        
        <label for="myZone">Twoja strefa ITU (np. 28):</label> <!-- Etykieta strefy ITU stacji. -->
        <input type="text" id="myZone" placeholder="np. dla POLSKI ITU 28" oninput="this.value=this.value.toUpperCase()"> <!-- Pole strefy ITU z wymuszeniem wielkich liter. -->
    </div> <!-- Koniec bloku danych stacji. -->

    <!-- SEKCJA 2: Kategoria zawodów -->
    <div class="config-box"> <!-- Kontener ustawień kategorii Cabrillo. -->
        <h2>Kategoria Zawodów IARU HF</h2> <!-- Nagłówek sekcji kategorii zawodów. -->

        <label for="categoryOperator">Kategoria operatora:</label> <!-- Etykieta kategorii operatora. -->
        <select id="categoryOperator"> <!-- Lista wyboru typu operatora. -->
            <option value="SINGLE-OP">SINGLE-OP</option> <!-- Opcja stacji jednoosobowej. -->
            <option value="MULTI-OP">MULTI-OP</option> <!-- Opcja stacji wieloosobowej. -->
        </select><br> <!-- Koniec listy operatora i przeście do nowej linii. -->

        <label for="categoryBand">Pasmo:</label> <!-- Etykieta wyboru pasma. -->
        <select id="categoryBand"> <!-- Lista wyboru pasma dla całej kategorii. -->
            <option value="ALL">ALL</option> <!-- Opcja pracy we wszystkich pasmach. -->
            <option value="160M">160M</option> <!-- Opcja pasma 160m. -->
            <option value="80M">80M</option> <!-- Opcja pasma 80m. -->
            <option value="40M">40M</option> <!-- Opcja pasma 40m. -->
            <option value="20M">20M</option> <!-- Opcja pasma 20m. -->
            <option value="15M">15M</option> <!-- Opcja pasma 15m. -->
            <option value="10M">10M</option> <!-- Opcja pasma 10m. -->
        </select><br> <!-- Koniec listy pasm i złamanie linii. -->

        <label for="categoryPower">Moc:</label> <!-- Etykieta kategorii mocy. -->
        <select id="categoryPower"> <!-- Lista wyboru kategorii mocowej. -->
            <option value="HIGH">HIGH</option> <!-- Kategoria wysokiej mocy. -->
            <option value="LOW">LOW</option> <!-- Kategoria niskiej mocy. -->
            <option value="QRP">QRP</option> <!-- Kategoria QRP (bardzo mała moc). -->
        </select><br> <!-- Koniec wyboru mocy i nowa linia. -->

        <label for="categoryMode">Tryb pracy:</label> <!-- Etykieta trybu pracy stacji. -->
        <select id="categoryMode"> <!-- Lista wyboru emisji dla kategorii. -->
            <option value="MIXED">MIXED</option> <!-- Kategoria mieszana (CW + SSB). -->
            <option value="CW">CW</option> <!-- Kategoria wyłącznie CW (telegrafia). -->
            <option value="SSB">SSB</option> <!-- Kategoria wyłącznie SSB (fonia). -->
        </select><br> <!-- Koniec listy wyboru emisji i nowa linia. -->

        <label for="categoryStation">Typ stacji:</label> <!-- Etykieta typu lokalizacji stacji. -->
        <select id="categoryStation"> <!-- Lista wyboru typu fizycznej stacji. -->
            <option value="FIXED">FIXED</option> <!-- Stacja stacjonarna. -->
            <option value="PORTABLE">PORTABLE</option> <!-- Stacja przenośna. -->
            <option value="MOBILE">MOBILE</option> <!-- Stacja mobilna (w ruchu). -->
            <option value="ROVER">ROVER</option> <!-- Stacja typu Rover. -->
        </select><br> <!-- Koniec listy wyboru typu stacji i nowa linia. -->

        <label for="operators">Operatorzy:</label> <!-- Etykieta spisu operatorów stacji. -->
        <input type="text" id="operators" placeholder="np. SP7LCK, SQ7CL" oninput="this.value=this.value.toUpperCase()"><br> <!-- Pole tekstowe ze spisem operatorów i automatycznymi wielkimi literami. -->
    </div> <!-- Koniec sekcji konfiguracji kategorii zawodów. -->

    <!-- SEKCJA 3: Formularz dodawania QSO -->
    <div class="qso-box"> <!-- Kontener wprowadzania nowej łączności. -->
        <h2>Nowa Łączność (QSO)</h2> <!-- Nagłówek sekcji tworzenia łączności. -->
        
        <label for="qsoCall">Znak korespondenta:</label> <!-- Etykieta znaku korespondenta. -->
        <input type="text" id="qsoCall" placeholder="np. SN0HQ" autofocus oninput="this.value=this.value.toUpperCase()"><br> <!-- Pole wpisywania znaku z automatycznym fokusem i konwersją na wielkie litery. -->
        
        <label for="qsoBand">Pasmo:</label> <!-- Etykieta pasma łączności. -->
        <select id="qsoBand"> <!-- Lista wyboru pasma dla dodawanego QSO. -->
            <option value="160M">160M</option> <!-- Wybór pasma 160 metrów. -->
            <option value="80M">80M</option> <!-- Wybór pasma 80 metrów. -->
            <option value="40M">40M</option> <!-- Wybór pasma 40 metrów. -->
            <option value="20M">20M</option> <!-- Wybór pasma 20 metrów. -->
            <option value="15M">15M</option> <!-- Wybór pasma 15 metrów. -->
            <option value="10M">10M</option> <!-- Wybór pasma 10 metrów. -->
        </select><br> <!-- Koniec wyboru pasma dla QSO. -->

        <label for="qsoMode">Emisja:</label> <!-- Etykieta typu emisji. -->
        <select id="qsoMode"> <!-- Lista wyboru emisji łączności. -->
            <option value="SSB" selected>SSB</option> <!-- Wybór emisji fonicznej SSB (domyślny). -->
            <option value="CW">CW</option> <!-- Wybór emisji telegraficznej CW. -->
        </select><br> <!-- Koniec wyboru emisji. -->

        <label for="qsoSnt">RST wysłany:</label> <!-- Etykieta dla wygenerowanego raportu RST. -->
        <input type="text" id="qsoSnt" value="59" placeholder="np. 59 lub 599" oninput="this.value=this.value.toUpperCase()"><br> <!-- Pole raportu nadanego z domyślną wartością 59. -->

        <label for="qsoRcv">RST odebrany:</label> <!-- Etykieta dla odbieranego raportu RST. -->
        <input type="text" id="qsoRcv" value="59" placeholder="np. 59 lub 599" oninput="this.value=this.value.toUpperCase()"><br> <!-- Pole raportu odebranego z domyślną wartością 59. -->

        <label for="qsoRcvd">Odebrane (HQ/ITU):</label> <!-- Etykieta wymienianego raportu strefy lub grupy HQ. -->
        <input type="text" id="qsoRcvd" placeholder="np. PZK lub 28" oninput="this.value=this.value.toUpperCase()"><br> <!-- Pole na oznaczenie strefy ITU lub nazwy organizacji HQ. -->
        
        <label>Rodzaj czasu:</label> <!-- Etykieta typu wprowadzania czasu. -->
        <div class="radio-group"> <!-- Kontener na przyciski wyboru czasu. -->
            <label><input type="radio" name="timeType" value="UTC" checked onchange="toggleTimeInput()"> UTC</label> <!-- Przełącznik automatycznego pobierania aktualnego czasu UTC. -->
            <label><input type="radio" name="timeType" value="MANUAL" onchange="toggleTimeInput()"> Ręcznie</label> <!-- Przełącznik ręcznego wprowadzania daty i czasu. -->
        </div><br> <!-- Koniec przełącznika typu czasu. -->

        <div id="manualTimeContainer" style="display: none;"> <!-- Ukryty domyślnie kontener na ręczną datę i czas. -->
            <label>Data i czas:</label> <!-- Etykieta ręcznej daty/godziny. -->
            <input type="date" id="manualDate"> <!-- Pole wyboru ręcznej daty. -->
            <input type="time" id="manualTime"> <!-- Pole wyboru ręcznej godziny. -->
        </div> <!-- Koniec bloku ręcznego wprowadzania czasu. -->
        
        <button id="addQsoBtn" onclick="addQSO()">DODAJ ŁĄCZNOŚĆ (Enter)</button> <!-- Przycisk wywołujący dodawanie QSO. -->
    </div> <!-- Koniec sekcji formularza QSO. -->

    <!-- SEKCJA 4: Statystyki i pobieranie logów -->
    <div class="counter">Liczba łączności: <span id="qsoCount">0</span></div> <!-- Wynik dynamicznego licznika zrobionych łączności. -->

    <button onclick="exportADIF()" style="background-color: #10b981; color: white; margin-bottom: 10px;">POBIERZ ADIF</button> <!-- Przycisk generowania pliku ADIF. -->
    <button onclick="exportCabrillo()" style="background-color: var(--accent); color: white; margin-bottom: 20px;">POBIERZ CABRILLO</button> <!-- Przycisk generowania pliku Cabrillo. -->

    <h2>Podgląd łączności</h2> <!-- Nagłówek tabeli z podglądem łączności. -->
    <table id="qsoTable"> <!-- Tabela przechowująca wpisane rekordy QSO. -->
        <thead> <!-- Nagłówek tabeli. -->
            <tr> <!-- Wiersz nagłówka tabeli. -->
                <th>Nr</th> <!-- Kolumna: Numer kolejny QSO. -->
                <th>Data/Czas</th> <!-- Kolumna: Data i czas przeprowadzenia łączności. -->
                <th>Pasmo</th> <!-- Kolumna: Użyte pasmo. -->
                <th>Emisja</th> <!-- Kolumna: Zastosowana emisja. -->
                <th>Znak</th> <!-- Kolumna: Znak korespondenta. -->
                <th>RST</th> <!-- Kolumna: Wymienione raporty RST. -->
                <th>Odebrano</th> <!-- Kolumna: Odebrana strefa ITU lub symbol HQ. -->
                <th>Akcja</th> <!-- Kolumna: Przycisk operacji na wierszu. -->
            </tr> <!-- Koniec wiersza nagłówka. -->
        </thead> <!-- Koniec sekcji thead. -->
        <tbody></tbody> <!-- Puste ciało tabeli wypełniane dynamicznie w JavaScript. -->
    </table> <!-- Koniec definicji tabeli. -->
    <button onclick="clearLogs()" style="background-color: #ef4444; color: #ffffff; margin-top: 30px; margin-bottom: 10px;">WYCZYŚĆ ŁĄCZNOŚCI (RESET LOGU)</button> <!-- Przycisk całkowitego resetowania pamięci łączności. -->

    <!-- [SZYBKA MODYFIKACJA: INFORMACJA W STOPCE] -->
    <div class="footer"> <!-- Kontener ze stopką informacyjną. -->
        Stworzone dla PZK przez SP7LCK oraz SQ7CL | Kod na licencji MIT (Open Source) <!-- Informacja o autorach i licencji. -->
    </div> <!-- Koniec stopki. -->
</div> <!-- Koniec głównego kontenera aplikacji. -->

<script> // Początek skryptu wykonawczego JavaScript.
    // ZMIENNE STANU APLIKACJI
    let qsoList = []; // [KLUCZOWE MIEJSCE LOGIKI] Glówna tablica przechowująca obiekty zapisanych QSO.
    let qsoCounter = 1; // Licznik przypisujący unikalny numer kolejny dla nowych QSO.

    // PRZEŁĄCZANIE MOTYWU (LIGHT / DARK)
    function toggleTheme() { // Funkcja przełączająca tryb kolorystyczny aplikacji.
        const html = document.documentElement; // Pobranie głównego elementu html.
        const currentTheme = html.getAttribute("data-theme"); // Odczytanie bieżącego motywu z atrybutu.
        const newTheme = currentTheme === "dark" ? "light" : "dark"; // Zmiana stanu na przeciwny.
        
        html.setAttribute("data-theme", newTheme); // Ustawienie nowego motywu w drzewie DOM.
        localStorage.setItem("iaru_theme", newTheme); // Zapis wybranego motywu w pamięci przeglądarki.
        updateThemeButtonText(newTheme); // Wywołanie aktualizacji napisu na przycisku.
    } // Koniec funkcji toggleTheme.

    function updateThemeButtonText(theme) { // Funkcja aktualizująca tekst przycisku motywu.
        const btn = document.getElementById("themeToggleBtn"); // Pobranie przycisku przełączania z DOM.
        if (theme === "dark") { // Jeśli wybrany motyw to ciemny.
            btn.innerHTML = "☀️ Motyw: Jasny"; // Ustawienie tekstu zachęcającego do włączenia jasnego motywu.
        } else { // W przeciwnym wypadku (motyw jasny).
            btn.innerHTML = "🌙 Motyw: Ciemny"; // Ustawienie tekstu zachęcającego do włączenia nocnego motywu.
        } // Koniec instrukcji warunkowej.
    } // Koniec funkcji updateThemeButtonText.

    // NAWIGACJA KLAWISZEM ENTER
    document.getElementById("qsoCall").addEventListener("keyup", function(event) { // Nasłuchiwanie klawiszy w polu znaku.
        if (event.key === "Enter") document.getElementById("qsoSnt").focus(); // Po kliknięciu Enter przejdź do pola raportu wysłanego.
    }); // Koniec zdarzenia dla qsoCall.
    document.getElementById("qsoSnt").addEventListener("keyup", function(event) { // Nasłuchiwanie klawiszy w polu RST wysłanego.
        if (event.key === "Enter") document.getElementById("qsoRcv").focus(); // Po Enter przejdź do pola RST odebranego.
    }); // Koniec zdarzenia dla qsoSnt.
    document.getElementById("qsoRcv").addEventListener("keyup", function(event) { // Nasłuchiwanie klawiszy w polu RST odebranego.
        if (event.key === "Enter") document.getElementById("qsoRcvd").focus(); // Po Enter przejdź do pola raportu wymiany (HQ/ITU).
    }); // Koniec zdarzenia dla qsoRcv.
    document.getElementById("qsoRcvd").addEventListener("keyup", function(event) { // Nasłuchiwanie klawiszy w polu wymiany.
        if (event.key === "Enter") addQSO(); // Po Enter na ostatnim polu dodaj łączność.
    }); // Koniec zdarzenia dla qsoRcvd.

    // ZMIANA RAPORTU DLA EMISJI
    document.getElementById('qsoMode').addEventListener('change', function() { // Reakcja na zmianę wybranej emisji.
        const mode = this.value; // Odczyt wybranej wartości emisji.
        const rstSnt = document.getElementById('qsoSnt'); // Pobranie pola RST nadanego.
        const rstRcv = document.getElementById('qsoRcv'); // Pobranie pola RST odebranego.
        
        if (mode === 'CW') { // Jeśli wybrano telegrafię.
            if (rstSnt.value === '59') rstSnt.value = '599'; // Automatyczna zmiana raportu nadanego z 59 na 599.
            if (rstRcv.value === '59') rstRcv.value = '599'; // Automatyczna zmiana raportu odebranego z 59 na 599.
        } else if (mode === 'SSB') { // Jeśli przełączono na fonię.
            if (rstSnt.value === '599') rstSnt.value = '59'; // Przywrócenie fonicznego raportu 59.
            if (rstRcv.value === '599') rstRcv.value = '59'; // Przywrócenie fonicznego raportu 59.
        } // Koniec warunku spradzającego emisję.
    }); // Koniec zdarzenia zmiany emisji.

    function toggleTimeInput() { // Funkcja przełączająca widoczność pól ręcznego wprowadzania daty/czasu.
        const timeType = document.querySelector('input[name="timeType"]:checked').value; // Pobranie zaznaczonej opcji typu czasu.
        const container = document.getElementById("manualTimeContainer"); // Pobranie kontenera ze sterowaniem czasem ręcznym.
        if (timeType === "MANUAL") { // Jeśli użytkownik wybrał opcję wpisywania ręcznego.
            container.style.display = "block"; // Pokazanie pól daty i godziny.
            const now = new Date(); // Pobranie aktualnego systemowego obiektu daty.
            document.getElementById("manualDate").value = now.toISOString().substring(0, 10); // Wypełnienie pola daty bieżącym dniem.
            document.getElementById("manualTime").value = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0'); // Wypełnienie pola czasu bieżącą godziną.
        } else { // W przypadku wyboru trybu UTC.
            container.style.display = "none"; // Ukrycie pól wprowadzania ręcznego.
        } // Koniec spradzania trybu czasu.
    } // Koniec funkcji toggleTimeInput.
    
    /* [SZYBKA MODYFIKACJA: MAPOWANIE PASM DLA ADIF] 
       Tabela mapa pasmo -> częstotliwość w MHz używana przy eksporcie do pliku ADIF. */
    const bandFreqs = {
        "160M": "1.80000", "80M": "3.50000", "40M": "7.00000",
        "20M": "14.20000", "15M": "21.20000", "10M": "28.40000"
    }; // Koniec przypisania częstotliwości dla ADIF.

    /* [SZYBKA MODYFIKACJA: MAPOWANIE PASM DLA CABRILLO] 
       Tabela mapa pasmo -> częstotliwość w kHz zapisywana w plikach Cabrillo. */
    const cabrilloFreqs = {
        "160M": "1800", "80M": "3500", "40M": "7000",
        "20M": "14000", "15M": "21000", "10M": "28000"
    }; // Koniec przypisania częstotliwości dla Cabrillo.

    /* [SZYBKA MODYFIKACJA: MAPOWANIE OZNACZEŃ EMISJI DLA CABRILLO] */
    const cabrilloModes = { "SSB": "PH", "CW": "CW" }; // Słownik mapujący standard nazewnictwa emisji z interfejsu na wymagany format Cabrillo (PH/CW).

    function addQSO() { // [KLUCZOWE MIEJSCE LOGIKI DANYCH] Funkcja odczytująca dane z formularza i tworząca rekord QSO.
        const call = document.getElementById("qsoCall").value.trim(); // Pobranie i usunięcie zbędnych spacji ze znaku korespondenta.
        const band = document.getElementById("qsoBand").value; // Pobranie wybranego pasma z formularza.
        const mode = document.getElementById("qsoMode").value; // Pobranie wybranej emisji z formularza.
        const snt = document.getElementById("qsoSnt").value.trim() || "59"; // Pobranie nadanego RST lub ustawienie wartości domyślnej 59.
        const rcv = document.getElementById("qsoRcv").value.trim() || "59"; // Pobranie odebranego RST lub ustawienie wartości domyślnej 59.
        const rcvd = document.getElementById("qsoRcvd").value.trim(); // Pobranie ciągu odebranego (skrót HQ lub strefa ITU).
        
        if (call === "" || rcvd === "") { // Sprawdzenie czy wymagane pola (Znak oraz Odebrano) zostały uzupełnione.
            alert("Proszę uzupełnić Znak korespondenta oraz pole Odebrane (HQ/ITU)!"); // Wyświetlenie komuniaktu ostrzegawczego.
            return; // Przerwanie wykonywania funkcji w przypadku braku danych.
        } // Koniec warunku walidacji pól.

        const timeType = document.querySelector('input[name="timeType"]:checked').value; // Odczyt wybranego trybu wyliczania czasu.
        let yyyy, mm, dd, hh, min, ss; // Deklaracja zmiennych skladowych czasu.

        if (timeType === "UTC") { // Jeśli wybrano czas automatyczny UTC.
            const now = new Date(); // Utworzenie obiektu z aktualną datą i czasem systemowym.
            yyyy = now.getUTCFullYear(); // Wyciągnięcie roku UTC.
            mm = String(now.getUTCMonth() + 1).padStart(2, '0'); // Wyciągnięcie miesiąca UTC z uzupełnieniem do 2 cyfr.
            dd = String(now.getUTCDate()).padStart(2, '0'); // Wyciągnięcie dnia miesiąca UTC.
            hh = String(now.getUTCHours()).padStart(2, '0'); // Wyciągnięcie godziny UTC.
            min = String(now.getUTCMinutes()).padStart(2, '0'); // Wyciągnięcie minut UTC.
            ss = String(now.getUTCSeconds()).padStart(2, '0'); // Wyciągnięcie sekund UTC.
        } else { // W przypadku wyboru ręcznej edycji czasu.
            const manualDateVal = document.getElementById("manualDate").value; // Pobranie ciągu tekstowego daty z formularza.
            const manualTimeVal = document.getElementById("manualTime").value; // Pobranie ciągu tekstowego godziny z formularza.

            if (!manualDateVal || !manualTimeVal) { // Sprawdzenie czy ręczna data i godzina zostały wpisane.
                alert("Proszę poprawnie uzupełnić ręczną datę i godzinę łączności!"); // Komunikat o braku danych czasowych.
                return; // Przerwanie wykonywania funkcji.
            } // Koniec weryfikacji danych ręcznych.

            const dateParts = manualDateVal.split("-"); // Podział tekstu daty na części po separatorze "-".
            const timeParts = manualTimeVal.split(":"); // Podział tekstu godziny na części po separatorze ":".

            yyyy = dateParts[0]; mm = dateParts[1]; dd = dateParts[2]; // Przypisanie składowych daty.
            hh = timeParts[0]; min = timeParts[1]; ss = "00"; // Przypisanie składowych czasu z ustawieniem sekund na "00".
        } // Koniec podziału pobierania daty i czasu.

        const qsoDate = `${yyyy}${mm}${dd}`; // Formatowanie daty do postaci skompresowanej RRRRMMDD.
        const qsoTime = `${hh}${min}${ss}`; // Formatowanie czasu do postaci skompresowanej GGMMSS.
        const labelTimeType = timeType === "UTC" ? "UTC" : "MAN"; // Tworzenie krótkiej etykiety czasu (UTC lub MAN).

        const mockId = Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join(''); // Generowanie losowego identyfikatora UID QSO o długości 32 znaków w kodzie szesnastkowym.

        const qso = { // Budowanie obiektu stanowiącego pełny rekord łączności.
            nr: qsoCounter++, // Przypisanie obecnego numeru i inkrementacja licznika o 1.
            call: call, // Przypisanie znaku korespondenta.
            date: qsoDate, // Przypisanie daty łączności.
            time: qsoTime, // Przypisanie czasu łączności.
            timeLabel: labelTimeType, // Przypisanie etykiety pochodzenia czasu.
            band: band, // Przypisanie pasma.
            freq: bandFreqs[band], // Przypisanie wyznaczonej częstotliwości z obiketu mapującego.
            mode: mode, // Przypisanie wybranej emisji.
            rstSnt: snt, // Przypisanie nadanego raportu RST.
            rstRcv: rcv, // Przypisanie odebranego raportu RST.
            rcvd: rcvd, // Przypisanie odebranych danych wymiany.
            id: mockId // Przypisanie unikalnego identyfikatora ID.
        }; // Koniec definicji obiektu QSO.

        qsoList.push(qso); // Dodanie nowo utworzonego obiektu do głównej tablicy danych.
        updateTable(qso); // Wywołanie dodania nowego wiersza w widocznej tabeli HTML.

        document.getElementById("qsoCall").value = ""; // Czyszczenie pola wprowadzania znaku korespondenta.
        document.getElementById("qsoRcvd").value = ""; // Czyszczenie pola odebranej strefy/HQ.
        document.getElementById("qsoCall").focus(); // Ustawienie kursora w polu ze znakiem przygotowujące do kolejnego wpisu.
        document.getElementById("qsoCount").innerText = qsoList.length; // Aktualizacja wartości dynamicznego licznika łączności.

        saveToLocalStorage(); // [KLUCZOWE MIEJSCE LOGIKI ZAPISU] Zapis aktualnego stanu do localStorage.
    } // Koniec funkcji addQSO.

    function updateTable(qso) { // Funkcja wstawiająca pojedynczy wiersz z łącznością na początek tabeli.
        const tbody = document.getElementById("qsoTable").getElementsByTagName('tbody')[0]; // Pobranie sekcji tbody z tabeli łączności.
        const row = tbody.insertRow(0); // Wstawienie nowego wiersza na samej górze tabeli (indeks 0).
        
        const displayTime = `${qso.date.substring(0,4)}-${qso.date.substring(4,6)}-${qso.date.substring(6,8)} ${qso.time.substring(0,2)}:${qso.time.substring(2,4)} ${qso.timeLabel}`; // Sformatowanie czytelnej daty i godziny do tabeli.

        row.innerHTML = ` 
            <td>${qso.nr}</td>
            <td>${displayTime}</td>
            <td>${qso.band}</td>
            <td>${qso.mode}</td>
            <td><strong>${qso.call}</strong></td>
            <td>${qso.rstSnt} / ${qso.rstRcv}</td>
            <td>${qso.rcvd}</td>
            <td><button onclick="deleteQSO('${qso.id}')" style="background-color: #ef4444; color: #FFFFFF; font-size: 13px; padding: 4px 10px; margin: 0; width: auto; border-radius: 6px;">USUŃ</button></td>
        `; // Wypełnienie komórek wiersza odpowiednimi zmiennymi i przyciskiem usuwania.
    } // Koniec funkcji updateTable.

    function renderTable() { // Funkcja wyrysowująca całą tabelę od nowa na podstawie zawartości qsoList.
        const tbody = document.getElementById("qsoTable").getElementsByTagName('tbody')[0]; // Pobranie ciała tabeli z HTML.
        tbody.innerHTML = ""; // Wyczyszczenie całej zawartości ciala tabeli.
        qsoList.forEach(qso => { // Przeiterowanie po każdym elemencie w tablicy QSO.
            updateTable(qso); // Wywołanie rysowania wiersza dla każdego rekord.
        }); // Koniec pętli dla każdego elementu.
    } // Koniec funkcji renderTable.

    function deleteQSO(id) { // Funkcja usuwająca łączność o wskazanym identyfikatorze ID.
        const qsoIndex = qsoList.findIndex(q => q.id === id); // Wyszukanie indeksu danego QSO w tablicy po ID.
        if (qsoIndex === -1) return; // Jeśli nie znaleziono elementu, przerwij działanie.

        const call = qsoList[qsoIndex].call; // Pobranie znaku dla łączności przed jej usunięciem w celu pokazania go w pytaniu.
        if (confirm(`Czy na pewno chcesz usunąć łączność ze znakiem ${call}?`)) { // Prośba o potwierdzenie decyzji przez użytkownika.
            qsoList.splice(qsoIndex, 1); // Usunięcie 1 elementu pod wyznaczonym indeksem z tablicy.
            saveToLocalStorage(); // Aktualizacja danych przechowywanych w localStorage.
            renderTable(); // Odświeżenie widoku całej tabeli po usunięciu elementu.
            document.getElementById("qsoCount").innerText = qsoList.length; // Zaktualizowanie wskaźnika całkowitej liczby łączności.
        } // Koniec weryfikacji decyzji o usunięciu.
    } // Koniec funkcji deleteQSO.

    function generateAdifTag(tagName, value) { // Pomocnicza funkcja formatująca wpisy według specyfikacji standardu ADIF.
        if (!value) return ""; // Jeśli brak wartości, zwróć pusty ciąg.
        return `<${tagName}:${value.length}>${value} `; // Zwróć ciąg tekstowy w formacie <TAG:DŁUGOŚĆ>WARTOŚĆ.
    } // Koniec funkcji generującej znacznik ADIF.

    function exportADIF() { // [KLUCZOWE MIEJSCE LOGIKI EKSPORTU ADIF] Funkcja generująca i pobierająca plik .ADI.
        if (qsoList.length === 0) { // Sprawdzenie czy w tabeli są jakiekolwiek zapisane łączności.
            alert("Brak łączności do wyeksportowania!"); // Komunikat o braku danych.
            return; // Zakończenie funkcji.
        } // Koniec warunku sprawdzającego brak wpisów.

        /* [SZYBKA MODYFIKACJA: DOMYŚLNY ZNAK DLA EKSPORTU ADIF] */
        const myCall = document.getElementById("myCall").value.trim() || "SP7LCK"; // Pobranie wpisanego znaku lub użycie wartości domyślnej.
        const now = new Date(); // Odczyt bieżącego czasu do nagłówka eksportu.
        const currentTimestamp = now.toISOString().replace(/T/, ' ').replace(/\..+/, '') + 'Z'; // Formatowanie daty dla stempla w pliku ADIF.

        /* [SZYBKA MODYFIKACJA: NAGŁÓWEK PLIKU ADIF] */
        let adifContent = `ADIF Export from N1MMLogger.net - Version 1.0.11229.0\r\n`; // Nagłówek identyfikujący oprogramowanie generujące.
        adifContent += `Built: 19.05.2026 15:38:06\r\n`; // Dodatkowe informacje o kompilacji zawarte w nagłówku.
        adifContent += `${myCall} logs generated @ ${currentTimestamp}\r\n`; // Linia z podaniem znaku oraz timestampem wygenerowania pliku.
        adifContent += `Contest Name: IARU - 2026-07-11\r\n`; // Nazwa zawodów zapisywana w nagłówku ADIF.
        adifContent += `<EOH>\r\n`; // Koniec sekcji nagłówkowej pliku ADIF (End Of Header).

        qsoList.forEach(qso => { // Pętla generująca wpis pojedynczej łączności dla każdego QSO z tablicy.
            let line = ""; // Inicjalizacja pustego ciągu pojedynczego wiersza pliku.
            line += generateAdifTag("CALL", qso.call); // Dodanie znacznika CALL.
            line += generateAdifTag("QSO_DATE", qso.date); // Dodanie znacznika daty przeprowadzenia QSO.
            line += generateAdifTag("TIME_ON", qso.time); // Dodanie znacznika czasu rozpoczęcia łączności.
            line += generateAdifTag("TIME_OFF", qso.time); // Dodanie znacznika czasu zakończenia łączności.
            line += generateAdifTag("APP_N1MM_HQ", qso.rcvd); // Dodanie niestandardowego znacznika stacji HQ dla kompatybilności z N1MM.
            line += generateAdifTag("BAND", qso.band); // Dodanie znacznika pasma.
            line += generateAdifTag("STATION_CALLSIGN", myCall); // Dodanie znacznika znaku własnej stacji.
            line += generateAdifTag("FREQ", qso.freq); // Dodanie znacznika częstotliwości w MHz.
            line += generateAdifTag("CONTEST_ID", "IARU-HF"); // Dodanie unikalnego identyfikatora zawodów.
            line += generateAdifTag("FREQ_RX", qso.freq); // Dodanie częstotliwości odbiorczej.
            line += generateAdifTag("MODE", qso.mode); // Dodanie typu emisji.
            line += generateAdifTag("RST_SENT", qso.rstSnt); // Dodanie raportu RST nadanego.
            line += generateAdifTag("RST_RCVD", qso.rstRcv); // Dodanie raportu RST odebranego.
            line += generateAdifTag("TX_PWR", "100"); // Stała deklaracja mocy nadawania w pliku ADIF.
            line += generateAdifTag("OPERATOR", myCall); // Dodanie informacji o nazwie operatora.
            line += generateAdifTag("STX", qso.nr.toString()); // Dodanie kolejnego numeru nadanego QSO.
            line += generateAdifTag("APP_N1MM_POINTS", "1"); // Przypisanie domyślnej liczby punktów na potrzeby N1MM.
            line += generateAdifTag("APP_N1MM_RADIO_NR", "1"); // Numer radia w konfiguracji N1MM.
            line += generateAdifTag("APP_N1MM_CONTINENT", "EU"); // Domyślny kontynent (Europa).
            line += generateAdifTag("APP_N1MM_RUN1RUN2", "1"); // Identyfikator pracy z poziomu nadajnika RUN1 w N1MM.
            line += generateAdifTag("APP_N1MM_RADIOINTERFACED", "0"); // Informacja o braku dedykowanego interfejsu CAT radia.
            line += generateAdifTag("APP_N1MM_ISORIGINAL", "True"); // Oznaczenie oryginalności wpisu.
            line += generateAdifTag("APP_N1MM_NETBIOSNAME", "LOG-PROSTY"); // Nazwa komputera w pliku logu.
            line += generateAdifTag("APP_N1MM_ISRUNQSO", "0"); // Oznaczenie braku pracy w trybie szybkiego wołania stacji.
            
            let pfx = qso.call.substring(0, 3); // Wyciągnięcie pierwszych 3 znaków jako prefiksu łączności.
            line += generateAdifTag("PFX", pfx); // Zapisanie wartości wyznaczonego prefiksu.
            
            line += generateAdifTag("APP_N1MM_MULT1", "0"); // Wartość dla pierwszego mnożnika.
            line += generateAdifTag("APP_N1MM_MULT2", "1"); // Wartość dla drugiego mnożnika.
            line += generateAdifTag("APP_N1MM_MULT3", "0"); // Wartość dla trzeciego mnożnika.
            line += generateAdifTag("APP_N1MM_ID", qso.id); // Przypisanie unikalnego ID do wpisu w ADIF.
            line += generateAdifTag("APP_N1MM_CLAIMEDQSO", "1"); // Potwierdzenie zaliczenia łączności.
            line += "<EOR>\r\n"; // Znacznik końca rekordu w standardzie ADIF (End Of Record).
            
            adifContent += line; // Dopisanie utworzonej linii do głównej zawartości pliku.
        }); // Koniec iteracji po liście QSO.

        const blob = new Blob([adifContent], { type: "text/plain;charset=utf-8" }); // Stworzenie obiektu binarnego Blob zawierającego dane pliku.
        const link = document.createElement("a"); // Utworzenie ukrytego elementu linku <a> do inicjacji pobierania.
        link.href = URL.createObjectURL(blob); // Utworzenie wskaźnika URL do danych z pamięci podręcznej.
        
        /* [SZYBKA MODYFIKACJA: NAZWA POBIERANEGO PLIKU ADIF] */
        link.download = `${myCall}_IARU_2026.adi`; // Definicja domyślnej nazwy dla pobieranego pliku ADIF.
        link.click(); // Automatyczne kliknięcie wywołujące dialog pobierania w przeglądarce.
    } // Koniec funkcji exportADIF.

    function padField(text, width, alignLeft = true) { // Pomocnicza funkcja wyrównująca długość tekstów spacjami dla formatu Cabrillo.
        text = String(text); // Konwersja przekazanej wartości na typ tekstowy.
        if (text.length >= width) return text.substring(0, width); // Jeśli tekst przekracza zakładaną szerokość, przytnij go.
        return alignLeft ? text.padEnd(width, ' ') : text.padStart(width, ' '); // Wyrównanie do lewej lub do prawej poprzez dopełnienie spacjami.
    } // Koniec funkcji padField.

    function exportCabrillo() { // [KLUCZOWE MIEJSCE LOGIKI EKSPORTU CABRILLO] Funkcja budująca plik raportu w formacie Cabrillo 3.0.
        if (qsoList.length === 0) { // Sprawdzenie czy w logu są jakiekolwiek łączności.
            alert("Brak łączności do wyeksportowania!"); // Komunikat o braku łączności.
            return; // Przerwanie wykonywania funkcji.
        } // Koniec weryfikacji łączności.

        /* [SZYBKA MODYFIKACJA: WARTOSCI DOMYŚLNE CABRILLO] */
        const myCall = (document.getElementById("myCall").value.trim() || "SP7LCK").toUpperCase(); // Pobranie własnego znaku w postaci wielkich liter lub użycie domyślnego.
        const myZone = (document.getElementById("myZone").value.trim() || "28").toUpperCase(); // Pobranie własnej strefy ITU lub przypisanie domyślnej strefy 28.
        
        const catOp = document.getElementById("categoryOperator").value; // Pobranie konfiguracji kategorii operatora.
        const catBand = document.getElementById("categoryBand").value; // Pobranie konfiguracji kategorii pasmowej.
        const catPower = document.getElementById("categoryPower").value; // Pobranie konfiguracji wybranej mocy.
        const catMode = document.getElementById("categoryMode").value; // Pobranie konfiguracji trybu/emisji.
        const catStation = document.getElementById("categoryStation").value; // Pobranie typu stacji.
        const ops = document.getElementById("operators").value.trim() || myCall; // Pobranie listy operatorów lub przypisanie znaku własnego.
        
        const score = qsoList.length; // Proste wyliczenie wyniku na podstawie liczby łączności.

        /* [SZYBKA MODYFIKACJA: NAGŁÓWEK CABRILLO] Możliwość modyfikacji stałych pól struktury pliku. */
        let cabContent = `START-OF-LOG: 3.0\r\n`; // Deklaracja wersji standardu Cabrillo.
        cabContent += `LOCATION: DX\r\n`; // Domyślna lokalizacja stacji dla uczestników spoza USA/Kanady.
        cabContent += `CALLSIGN: ${myCall}\r\n`; // Wpisanie własnego znaku w nagłówku.
        cabContent += `CLUB: \r\n`; // Pole na nazwę klubu.
        cabContent += `CONTEST: IARU-HF\r\n`; // Oficjalny identyfikator zawodów.
        cabContent += `CATEGORY-OPERATOR: ${catOp}\r\n`; // Wpisanie zgłoszonej kategorii operatora.
        cabContent += `CATEGORY-ASSISTED: ASSISTED\r\n`; // Zgłoszenie statusu korzystania z pomocy zewnętrznej.
        cabContent += `CATEGORY-BAND: ${catBand}\r\n`; // Wpisanie kategorii pasmowej.
        cabContent += `CATEGORY-MODE: ${catMode}\r\n`; // Wpisanie kategorii emisyjnej.
        cabContent += `CATEGORY-POWER: ${catPower}\r\n`; // Wpisanie kategorii mocy.
        cabContent += `CATEGORY-STATION: ${catStation}\r\n`; // Wpisanie typu stacji.
        cabContent += `CATEGORY-TRANSMITTER: ONE\r\n`; // Wybór kategorii dla jednego nadajnika.
        cabContent += `CLAIMED-SCORE: ${score}\r\n`; // Zapisanie prognozowanego wyniku łączności.
        cabContent += `OPERATORS: ${ops}\r\n`; // Wpisanie listy operatorów stacji.
        cabContent += `NAME: \r\n`; // Puste pole na nazwisko.
        cabContent += `ADDRESS: \r\n`; // Puste pole na adres.
        cabContent += `ADDRESS-CITY: \r\n`; // Puste pole na miasto.
        cabContent += `ADDRESS-STATE-PROVINCE: \r\n`; // Puste pole na województwo/stan.
        cabContent += `ADDRESS-POSTALCODE: \r\n`; // Puste pole na kod pocztowy.
        cabContent += `ADDRESS-COUNTRY: PL\r\n`; // Domyślny kraj użytkownika.
        cabContent += `GRID-LOCATOR: \r\n`; // Puste pole dla lokatora QTH.
        cabContent += `EMAIL: \r\n`; // Puste pole na adres e-mail.
        cabContent += `CREATED-BY: N1MM Logger+ 1.0.11229.0\r\n`; // Identyfikator generowania kompatybilny z N1MM.

        qsoList.forEach(qso => { // Przetwarzanie łączności z listy na wpisy formatu kolumnowego Cabrillo.
            const freq = padField(cabrilloFreqs[qso.band] || "14000", 5, false); // Formatowanie wartości częstotliwości w kHz.
            const mode = padField(cabrilloModes[qso.mode] || "PH", 2, true); // Formatowanie opisu emisji (CW lub PH dla SSB).
            const formattedDate = `${qso.date.substring(0, 4)}-${qso.date.substring(4, 6)}-${qso.date.substring(6, 8)}`; // Sformatowanie daty do postaci RRRR-MM-DD.
            const formattedTime = qso.time.substring(0, 4); // Sformatowanie czasu do 4 cyfr (HHMM).

            const c_myCall = padField(myCall, 13, true); // Wyrównanie własnego znaku do szerokości 13 znaków.
            const c_myRst = padField(qso.rstSnt, 3, true); // Wyrównanie nadanego raportu do 3 znaków.
            const c_myZone = padField(myZone, 6, true); // Wyrównanie własnej strefy do 6 znaków.
            const c_qsoCall = padField(qso.call.toUpperCase(), 13, true); // Wyrównanie znaku korespondenta do 13 znaków.
            const c_qsoRst = padField(qso.rstRcv, 3, true); // Wyrównanie odebranego raportu do 3 znaków.
            const c_qsoRcvd = padField(qso.rcvd.toUpperCase(), 6, true); // Wyrównanie odebranej strefy/HQ do 6 znaków.

            cabContent += `QSO: ${freq} ${mode} ${formattedDate} ${formattedTime} ${c_myCall} ${c_myRst} ${c_myZone} ${c_qsoCall} ${c_qsoRst} ${c_qsoRcvd}\r\n`; // Złożenie standardowego wiersza rekordu Cabrillo QSO.
        }); // Koniec generowania linii łączności.

        cabContent += `END-OF-LOG:\r\n`; // Znacznik oznaczający koniec pliku raportu Cabrillo.

        const blob = new Blob([cabContent], { type: "text/plain;charset=utf-8" }); // Stworzenie obiektu binarnego danych tekstowych.
        const link = document.createElement("a"); // Tworzenie dynamicznego uchwytu linku w DOM.
        link.href = URL.createObjectURL(blob); // Przypisanie odnośnika tymczasowego do pliku.
        
        /* [SZYBKA MODYFIKACJA: FORMAT NAZWY PLIKU LOGU] */
        link.download = `${myCall.toLowerCase()}.log`; // Definicja nazwy pobieranego pliku z rozszerzeniem .log.
        link.click(); // Kliknięcie pobierania pliku.
    } // Koniec funkcji exportCabrillo.

    function saveToLocalStorage() { // [KLUCZOWE MIEJSCE TRWAŁOŚCI DANYCH] Zapis stacji, konfiguracji oraz łączności w pamięci podręcznej przeglądarki.
        localStorage.setItem("iaru_qsoList", JSON.stringify(qsoList)); // Serializacja i zapis listy łączności do JSON.
        localStorage.setItem("iaru_qsoCounter", qsoCounter.toString()); // Zapis aktualnego stanu kolejnego numeru QSO.
        localStorage.setItem("iaru_myCall", document.getElementById("myCall").value); // Zapis znaku stacji.
        localStorage.setItem("iaru_myZone", document.getElementById("myZone").value); // Zapis strefy stacji.
        
        localStorage.setItem("iaru_catOp", document.getElementById("categoryOperator").value); // Zapis kategorii operatora.
        localStorage.setItem("iaru_catBand", document.getElementById("categoryBand").value); // Zapis wybranego pasma w konfiguracji.
        localStorage.setItem("iaru_catPower", document.getElementById("categoryPower").value); // Zapis wybranej kategorii mocy.
        localStorage.setItem("iaru_catMode", document.getElementById("categoryMode").value); // Zapis wybranej kategorii emisji.
        localStorage.setItem("iaru_catStation", document.getElementById("categoryStation").value); // Zapis kategorii typu stacji.
        localStorage.setItem("iaru_operators", document.getElementById("operators").value); // Zapis listy dodanych operatorów.
    } // Koniec funkcji saveToLocalStorage.

    // NASŁUCHIWANIE ZMIAN I AUTOMATYCZNY ZAPIS STANUS
    document.getElementById("myCall").addEventListener("input", saveToLocalStorage); // Reakcja na wpisanie znaku - automatyczny zapis.
    document.getElementById("myZone").addEventListener("input", saveToLocalStorage); // Reakcja na zmianę strefy - automatyczny zapis.
    document.getElementById("categoryOperator").addEventListener("change", saveToLocalStorage); // Reakcja na zmianę kategorii op.
    document.getElementById("categoryBand").addEventListener("change", saveToLocalStorage); // Reakcja na zmianę kategorii pasma.
    document.getElementById("categoryPower").addEventListener("change", saveToLocalStorage); // Reakcja na zmianę kategorii mocy.
    document.getElementById("categoryMode").addEventListener("change", saveToLocalStorage); // Reakcja na zmianę kategorii emisji.
    document.getElementById("categoryStation").addEventListener("change", saveToLocalStorage); // Reakcja na zmianę typu stacji.
    document.getElementById("operators").addEventListener("input", saveToLocalStorage); // Reakcja na edycję spisu operatorów.

    function clearLogs() { // Funkcja odpowiadająca za resetowanie stanu logu i czyszczenie pamięci.
        if (confirm("Czy na pewno chcesz CAŁKOWICIE WYCZYŚCIĆ wszystkie łączności z logu? Te dane zostaną utracone.")) { // Pierwszy krok weryfikacji chęci usunięcia bazy.
            if (confirm("Potwierdź operację kasowania. Czy pobrałeś wcześniej plik .ADI lub .LOG?")) { // Drugi krok potrójnej weryfikacji zapobiegający przypadkowemu skasowaniu danych.
                localStorage.removeItem("iaru_qsoList"); // Usunięcie klucza listy łączności z lokalnej pamięci.
                localStorage.removeItem("iaru_qsoCounter"); // Usunięcie klucza licznika łączności.
                qsoList = []; // Wyzerowanie roboczej tablicy w zmiennych JavaScript.
                qsoCounter = 1; // Zresetowanie wartości początkowej licznika QSO.
                document.getElementById("qsoCount").innerText = "0"; // Zresetowanie stanu widocznego licznika na ekranie.
                document.getElementById("qsoTable").getElementsByTagName('tbody')[0].innerHTML = ""; // Wyczyszczenie wierszy w widoku tabeli.
                alert("Log został pomyślnie wyczyszczony!"); // Informacja zwrotna o wyczyszczeniu bazy.
            } // Koniec drugiego potwierdzenia.
        } // Koniec pierwszego potwierdzenia.
    } // Koniec funkcji clearLogs.

    // INICJALIZACJA STANUS I MOTYWU PO ZAŁADOWANIU
    window.addEventListener("load", function() { // [KLUCZOWE MIEJSCE INICJALIZACJI APLIKACJI] Reakcja na zakończenie ładowania całej struktury dokumentu w przeglądarce.
        // Wczytanie motywu
        const savedTheme = localStorage.getItem("iaru_theme") || "light"; // Pobranie zapisanego motywu lub przydzielenie wartości domyślnej "light".
        document.documentElement.setAttribute("data-theme", savedTheme); // Przypisanie motywu do znacznika HTML.
        updateThemeButtonText(savedTheme); // Zaktualizowanie tekstu na przycisku motywu po załadowaniu.

        // Wczytanie logów
        const storedList = localStorage.getItem("iaru_qsoList"); // Pobranie z pamięci ciągu JSON zawierającego listę QSO.
        const storedCounter = localStorage.getItem("iaru_qsoCounter"); // Pobranie wartości zapisanego licznika.
        const storedCall = localStorage.getItem("iaru_myCall"); // Odczytanie własnego znaku z pamięci.
        const storedZone = localStorage.getItem("iaru_myZone"); // Odczytanie zapisanej strefy z pamięci.

        if (storedCall) document.getElementById("myCall").value = storedCall; // Przywrócenie znaku w polu tekstowym.
        if (storedZone) document.getElementById("myZone").value = storedZone; // Przywrócenie strefy w polu tekstowym.
        
        if (localStorage.getItem("iaru_catOp")) document.getElementById("categoryOperator").value = localStorage.getItem("iaru_catOp"); // Przywrócenie opcji typu operatora.
        if (localStorage.getItem("iaru_catBand")) document.getElementById("categoryBand").value = localStorage.getItem("iaru_catBand"); // Przywrócenie wybranego pasma.
        if (localStorage.getItem("iaru_catPower")) document.getElementById("categoryPower").value = localStorage.getItem("iaru_catPower"); // Przywrócenie ustawionej mocy.
        if (localStorage.getItem("iaru_catMode")) document.getElementById("categoryMode").value = localStorage.getItem("iaru_catMode"); // Przywrócenie zapisanej emisji zawodów.
        if (localStorage.getItem("iaru_catStation")) document.getElementById("categoryStation").value = localStorage.getItem("iaru_catStation"); // Przywrócenie typu stacji.
        if (localStorage.getItem("iaru_operators")) document.getElementById("operators").value = localStorage.getItem("iaru_operators"); // Przywrócenie listy operatorów.
        
        if (storedList && storedCounter) { // Jeśli znaleziono wcześniej zapisane pozycje logu.
            qsoList = JSON.parse(storedList); // Deserializacja danych JSON do obiektowej tablicy qsoList.
            qsoCounter = parseInt(storedCounter, 10); // Rzutowanie ciągu tekstowego na liczbę całkowitą w systemie dziesiętnym.
            document.getElementById("qsoCount").innerText = qsoList.length; // Odświeżenie wskaźnika całkowitej liczby łączności.

            renderTable(); // Wywołanie odrysowania wszystkich wierszy tabeli po zebraniu danych z pamięci.
        } // Koniec odtwarzania stanu bazy z localStorage.
    }); // Koniec podpięcia wywołania pod zdarzenie load.
</script> <!-- Koniec skryptów JavaScript. -->
